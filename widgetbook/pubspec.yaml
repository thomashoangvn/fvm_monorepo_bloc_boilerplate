name: design_widgetbook
description: The design system documentation of the project.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  deps:
    path: ../deps
  design:
    path: ../design
  flutter:
    sdk: flutter
  widgetbook: ^3.14.3
  widgetbook_annotation: ^3.5.0

dependency_overrides:
  flutter_secure_storage_web:
    git:
      url: https://github.com/fikretsengul/flutter_secure_storage.git
      path: flutter_secure_storage_web
      ref: develop

dev_dependencies:
  build_runner: ^2.4.15
  widgetbook_generator: ^3.13.0

flutter:
  uses-material-design: true
